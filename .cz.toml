# Releases of swarm-mcp go through swarm-routing/.github's reusable-release.yml
# (.github/workflows/release.yml; CONTRIBUTING "Cutting a release" there),
# swarm-routing/.github#636, on the maintainer's request only. The version is
# the server's `serverInfo.version` (VERSION in tools/swarm-mcp/swarm_mcp.py;
# its self-test checks the two agree). SemVer from the Conventional Commits
# since the last tag; the first release is v0.1.0 (from 0.0.0, which is never
# tagged: Commitizen will not bump a version to itself).
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
version_scheme = "semver"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
version_files = [
    "tools/swarm-mcp/swarm_mcp.py:^VERSION = ",
    "CITATION.cff:^version:",
]
