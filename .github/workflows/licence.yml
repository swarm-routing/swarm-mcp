name: Licence

# tools/ is MIT OR GPL-2.0-only, everything else GPL-2.0-only (LICENSING.md).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

jobs:
  headers:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@dd3e7c4131f92dca83e51c4f154ab8eff449caa5 # main@2026-11-25
    with:
      dual-roots: tools/
      core-roots: ''
