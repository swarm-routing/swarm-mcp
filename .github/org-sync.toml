# org-sync configuration (swarm-routing/.github tools/org-sync).
kind = "python"
# bestpractices.dev project (OpenSSF Best Practices badge; id read from the site's public JSON, swarm-routing/.github#765)
bestpractices_project = "17076"
# the org scripts the tools run import tomllib (Python 3.11+); the server alone needs 3.10
python = "3.11"
title = "swarm-mcp"
dual = ["tools/"]
# CITATION.cff seed and cite badge (swarm-routing/.github#636: versioned releases), cited
# by release tag: no Zenodo archive and no DOI (maintainer decision 2026-11-22,
# swarm-routing/.github#811), so no zenodo_concept, no DOI badge.
citation = true
zenodo = false
# External index badges (swarm-routing/.github#964, #967, #969): the M8ven MCP
# index's listing of this server, shown as its "M8ven Verified" badge by the
# publisher verify id (maintainer requirement 2026-11-26), then Glama's score
# badge for its listing (swarm-routing/.github#990, #991).
indexes = { m8ven-mcp = { id = "swarm-routing-swarm-mcp-kkxdjj", verify_id = "a770df99a2438405" }, glama = "swarm-routing/swarm-mcp" }
posture = "the org's agent tooling: a local, read-only MCP server over the org's scripts, no simulation code"
description = """
`swarm-mcp`, the swarm-routing org's **MCP server**: a local, read-only
[Model Context Protocol](https://modelcontextprotocol.io) server (stdio,
Python stdlib) whose tools each run one read-only command of a
`swarm-routing/.github` script (a fidelity sheet's checks, the golden-rule
checks on a diff, a release's readiness and aftercare, a release lock) and
return the script's own summary, capped. The Claude Code plugin
`swarm-routing` from [swarm-routing/skills](https://github.com/swarm-routing/skills)
starts it at the commit it pins; any other MCP client runs it the same way.
Skills hold the procedures, this repository the server, each versioned and
released on its own."""
trust_boundary = """
The arguments of a `tools/call` request, which come from the MCP client
(an agent). Only `tools/swarm-mcp/swarm_mcp.py` parses them: each tool's
schema is closed (an unknown argument is refused), every value is a
non-empty string that cannot start with `-` (no option reaches a script
through an argument) and the patterned ones (a version, a tag, a repository,
a ref) must match. The server runs a fixed table of read-only script
commands with an argument list, never a shell; it opens no connection, reads
no token and writes no file of its own. A script reaches the network only as
it does when a person runs it: `tools/swarm-mcp/org-tool` fetches
`swarm-routing/.github` (public HTTPS) unless `ORG_TOOLS_DIR` names a
checkout, and some scripts read GitHub with `gh` as the user. What it
collects, stores and sends (nothing) and what each script reaches:
[PRIVACY.md](PRIVACY.md); the limits it does have: the README's
[Security model](README.md#security-model)."""
limitations = """
- **The scripts are `swarm-routing/.github`'s.** The server runs them from a
  snapshot of the commit `.github/org-sync.lock` pins (or `ORG_TOOLS_REF`, or the checkout
  `ORG_TOOLS_DIR` names), so what a tool does is what that script does at
  that commit; review lands there.
- **Local stdio only.** There is no network transport and no authentication:
  whoever starts the server can call its tools, with their own permissions."""
verifying = """
- **A release asset.** Each release (from v0.1.0) carries
  `swarm-mcp-X.Y.Z.tar.gz`, `SHA256SUMS`, a CycloneDX SBOM and signed SLSA
  build provenance. For v0.1.0's archive, in the directory you downloaded
  `SHA256SUMS` and `swarm-mcp-0.1.0.tar.gz` to: `grep '
  swarm-mcp-0.1.0.tar.gz$' SHA256SUMS | sha256sum -c` (it fails unless
  that file is there and matches), then `gh attestation verify
  swarm-mcp-0.1.0.tar.gz --repo swarm-routing/swarm-mcp --signer-workflow
  swarm-routing/.github/.github/workflows/reusable-release.yml`; for
  another release, its version in both file names. The release notes give
  every command, offline included.
- **What your sessions run.** The Claude Code plugin starts this server at
  the commit `swarm-routing/skills` pins in `swarm-mcp.lock`, with the
  release tag that names it; check that the tag's commit
  (`git rev-parse vX.Y.Z^{commit}`) is the pinned one, and compare `git log`
  of this repository between two commits before moving the pin."""

[settings]
# GitHub settings as code: swarm-routing/.github tools/repo-settings (swarm-routing/.github#117).
description = "swarm-mcp, the swarm-routing org's local, read-only MCP server over its scripts (stdio, Python stdlib): fidelity sheets, golden-rule checks, release readiness, release locks. The skills plugin starts it at a pinned commit."
homepage = "https://swarm-routing.github.io/projects/swarm-mcp/"
topics = ["mcp", "model-context-protocol", "mcp-server", "claude-code", "ai-agents", "automation", "swarm-intelligence"]
ruleset = "tooling"
# Only checks that run on every PR today (ci.yml, licence.yml, org-sync.yml, pr-title.yml,
# review-gate.yml); each also runs on merge_group.
required_checks = ["lint", "python / python", "headers / licence", "check / org-sync", "title / title", "review / coderabbit"]
# report-only on purpose: Scorecard, CodeQL, the CodeRabbit status and the bot
# nudges (notify) run on main but never gate a PR (swarm-routing/.github#305)
optional_checks = ["analysis / Scorecard analysis", "Analyze (*)", "CodeRabbit", "notify"]
# Merge through a merge queue (swarm-routing/.github#130); every workflow behind a required
# check also runs on merge_group.
merge_queue = true

[docs]
arena_id = "swarm-mcp"  # its id in swarm-routing.github.io site/hub/projects.json (swarm-routing/swarm-routing.github.io#278)
